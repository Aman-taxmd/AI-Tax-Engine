[project]
name = "ai-tax-engine"
version = "0.1.0"
description = "IRS knowledge-driven tax calculation build system (Form 8889 pilot)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9; platform_system != 'Emscripten'",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pyyaml>=6.0",
    "typer>=0.12",
    "tenacity>=8.2",
    "structlog>=24.1",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "boto3>=1.34",
    "python-dotenv>=1.0",
    "streamlit>=1.38",
    "pypdf>=5.0",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ai-tax-engine = "build.cli:app"

[tool.setuptools.packages.find]
include = ["build*", "runtime*", "db*", "ui*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
